apiVersion: v1
kind: Service
metadata:
  name: calling-agent-ui
  namespace: calling-agent
spec:
  type: NodePort
  selector:
    app: calling-agent
  ports:
    - name: ui
      port: 8080
      targetPort: ui
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: calling-agent-media
  namespace: calling-agent
spec:
  type: ClusterIP
  selector:
    app: calling-agent
  ports:
    - name: media
      port: 5050
      targetPort: media
